<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Attendance</title>
<!-- 提前建立到 Firebase 各服务域名的连接，减少首次加载时的握手延迟 -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
<link rel="dns-prefetch" href="https://www.gstatic.com" />
<link rel="dns-prefetch" href="https://firestore.googleapis.com" />
<!-- 提前把 Firebase SDK 和自己的模块并行拉下来，缩短 ES module 逐层发现依赖的等待时间 -->
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" />
<link rel="modulepreload" href="js/firebase-init.js" />
<link rel="modulepreload" href="js/auth.js" />
<link rel="modulepreload" href="js/i18n.js" />
<link rel="modulepreload" href="js/utils.js" />
<link rel="modulepreload" href="js/employee.js" />
<link rel="modulepreload" href="js/admin.js" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">
  <div id="loading" class="loading-spinner">Loading...</div>

  <div id="view-login" class="login-wrap hidden"></div>

  <div id="view-main" class="hidden">
    <header class="topbar">
      <div class="title" id="app-title">Attendance</div>
      <div class="topbar-right">
        <div class="user-info" id="user-info"></div>
        <button class="lang-toggle-btn logout-btn-style" id="lang-toggle-main">中文</button>
        <button class="logout-btn" id="logout-btn">Log out</button>
      </div>
    </header>
    <main id="main-content"></main>
    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
