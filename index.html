<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Attendance</title>

<!-- PWA：可以在 iOS Safari 里「添加到主屏幕」，获得接近原生 App 的图标、启动画面和全屏体验 -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#4f46e5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Attendance" />
<meta name="format-detection" content="telephone=no" />

<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />

<!-- iOS 启动画面（不同机型尺寸），添加到主屏幕后点开图标瞬间显示，避免打开时的白屏空窗期 -->
<link rel="apple-touch-startup-image" href="splash/splash-iphonese-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

<link rel="apple-touch-startup-image" href="splash/splash-iphonexsmax-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
<link rel="apple-touch-startup-image" href="splash/splash-iphone13-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

<!-- 提前建立到 Firebase 各服务域名的连接，减少首次加载时的握手延迟 -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
<link rel="dns-prefetch" href="https://www.gstatic.com" />
<link rel="dns-prefetch" href="https://firestore.googleapis.com" />
<!-- 提前把 Firebase SDK 和自己的模块并行拉下来，缩短 ES module 逐层发现依赖的等待时间 -->
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" />
<link rel="modulepreload" href="js/firebase-init.js" />
<link rel="modulepreload" href="js/auth.js" />
<link rel="modulepreload" href="js/i18n.js" />
<link rel="modulepreload" href="js/utils.js" />
<link rel="modulepreload" href="js/employee.js" />
<link rel="modulepreload" href="js/admin.js" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">
  <div id="loading" class="loading-spinner">Loading...</div>

  <div id="view-login" class="login-wrap hidden"></div>

  <div id="view-main" class="hidden">
    <header class="topbar">
      <div class="title" id="app-title">Attendance</div>
      <div class="topbar-right">
        <div class="user-info" id="user-info"></div>
        <button class="lang-toggle-btn logout-btn-style" id="lang-toggle-main">中文</button>
        <button class="logout-btn" id="logout-btn">Log out</button>
      </div>
    </header>
    <main id="main-content"></main>
    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
